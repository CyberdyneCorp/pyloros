[package]
name = "pyloros-hook-worker"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ruff_python_ast = "=0.0.10"
ruff_python_parser = "=0.0.10"
ruff_source_file = "=0.0.10"
ruff_text_size = "=0.0.10"
serde_json = { version = "1", features = ["raw_value"] }
wasmtime = { version = "48.0.9", default-features = false, features = ["std", "runtime", "component-model", "cranelift", "anyhow"] }

[dev-dependencies]
wat = "1"

[profile.dev]
debug = 0
incremental = false

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["process"] }
