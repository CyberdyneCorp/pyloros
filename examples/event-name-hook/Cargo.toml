[package]
name = "event-name-hook"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
wit-bindgen = { version = "0.41", default-features = false, features = ["macros", "realloc"] }

[profile.release]
opt-level = "s"
strip = true

[[example]]
name = "silent_hook"
path = "examples/silent_hook.rs"
crate-type = ["cdylib"]

[dev-dependencies]
ryu = "1"
indexmap = { version = "2", features = ["serde"] }
unicode-general-category = "=1.1.0"
unicode-general-category-15 = { package = "unicode-general-category", version = "=0.6.0" }

[[example]]
name = "counter_hook"
path = "examples/counter_hook.rs"
crate-type = ["cdylib"]

[[example]]
name = "message_hook"
path = "examples/message_hook.rs"
crate-type = ["cdylib"]

[[example]]
name = "context_hook"
path = "examples/context_hook.rs"
crate-type = ["cdylib"]

[[example]]
name = "context_unicode15_hook"
path = "examples/context_unicode15_hook.rs"
crate-type = ["cdylib"]
