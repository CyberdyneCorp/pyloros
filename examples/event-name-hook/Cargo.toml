[package]
name = "event-name-hook"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = "1"
serde_json = { version = "1", features = ["raw_value"] }
wit-bindgen = { version = "0.41", default-features = false, features = ["macros", "realloc"] }

[profile.release]
opt-level = "s"
strip = true

[[example]]
name = "silent_hook"
path = "examples/silent_hook.rs"
crate-type = ["cdylib"]

[dev-dependencies]
ryu = "1"

[[example]]
name = "counter_hook"
path = "examples/counter_hook.rs"
crate-type = ["cdylib"]
