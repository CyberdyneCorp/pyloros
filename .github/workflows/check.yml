name: Rust checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @fission-ai/openspec@1.13.2
      - run: openspec validate --all --strict --no-interactive
      - run: openspec validate --archived --strict --no-interactive

  frontend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare a relocated console and detect dependency drift
        run: |
          fixture=$(mktemp -d)
          cat > "$fixture/Dockerfile" <<'DOCKER'
          FROM node:22-alpine AS build
          WORKDIR /app
          RUN mkdir -p build node_modules/.bin node_modules/sample && \
              echo '{}' > package.json && echo '{}' > package-lock.json && \
              echo 'require("node:http").createServer((req,res)=>{res.writeHead(req.url==="/login"?200:404,{"content-type":"text/html"});res.end("<html>Login</html>")}).listen(3001)' > build/index.js && \
              echo 'sample' > node_modules/sample/run && chmod +x node_modules/sample/run && \
              ln -s ../sample/run node_modules/.bin/sample
          FROM node:22-alpine AS runtime
          WORKDIR /app
          COPY --from=build /app/build ./build
          COPY --from=build /app/package.json ./
          COPY --from=build /app/node_modules ./node_modules
          USER node
          CMD ["node", "build"]
          FROM build AS changed-lock
          RUN echo '{"name":"another-build"}' > package-lock.json
          FROM runtime AS stopped
          CMD ["node", "--version"]
          FROM runtime AS drift
          USER root
          RUN chmod -x node_modules/sample/run
          DOCKER
          for stage in build runtime drift stopped changed-lock; do
            docker build --target "$stage" -t "console-$stage" "$fixture"
          done
          python3 scripts/check_frontend_image.py console-build console-runtime > "$fixture/reviewed.json"
          python3 scripts/check_frontend_image.py console-build console-runtime "$fixture/reviewed.json"
          if python3 scripts/check_frontend_image.py console-changed-lock console-runtime "$fixture/reviewed.json" 2>"$fixture/lock-error"; then
            exit 1
          fi
          grep -Fx 'Frontend runtime differs in package-lock.json' "$fixture/lock-error"
          python3 scripts/check_frontend_start.py console-runtime
          if python3 scripts/check_frontend_start.py console-stopped 2>"$fixture/start-error"; then
            exit 1
          fi
          grep -Fx 'Console stopped before serving the login page' "$fixture/start-error"
          if python3 scripts/check_frontend_image.py console-build console-drift 2>"$fixture/error"; then
            exit 1
          fi
          grep -Fx 'Image differs from build stage in node_modules' "$fixture/error"

  rebac-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run --spec uv==0.12.16 uv run --script scripts/check_rebac_contract.py

  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --tests -- --ignored

  hook-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - run: cargo fmt --manifest-path hook-worker/Cargo.toml -- --check
      - run: cargo clippy --manifest-path hook-worker/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path hook-worker/Cargo.toml --locked
      - run: cargo test --locked --manifest-path examples/event-name-hook/Cargo.toml --lib --example counter_hook
      - uses: actions/cache@v4
        id: component-tool
        with:
          path: ~/.cargo/bin/cargo-component
          key: cargo-component-0.21.1-${{ runner.os }}-${{ runner.arch }}
      - if: steps.component-tool.outputs.cache-hit != 'true'
        run: cargo install cargo-component --version 0.21.1 --locked
      - run: rustup target add wasm32-unknown-unknown
      - name: Run compiled examples with the Linux hook worker
        run: |
          cargo component build --locked --release --lib --examples --target wasm32-unknown-unknown --target-dir target/hook-examples --manifest-path examples/event-name-hook/Cargo.toml
          cargo build --locked --manifest-path hook-worker/Cargo.toml
          python3 scripts/check_hook_examples.py hook-worker/target/debug/pyloros-hook-worker target/hook-examples/wasm32-unknown-unknown/release
