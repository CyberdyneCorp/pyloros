[package]
name = "pyloros"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
jsonwebtoken = "9"
argon2 = "0.5"
chrono = "0.4"
rand = "0.8"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
base64 = "0.22"
rsa = "0.9"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }
serde_json = { version = "1", features = ["raw_value"] }
url = "2"
axum = { version = "0.8", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "chrono", "uuid", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util"] }
bcrypt = "0.19"
lettre = { version = "0.11.24", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls", "ring", "rustls-native-certs"] }
ring = "0.17"
data-encoding = "2"
zeroize = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
percent-encoding = "2"
unicode-general-category = "1"
unicode-normalization = "0.1"
idna = "1"
k256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
sha3 = "0.10"
minijinja = { version = "2", default-features = false, features = ["loader", "serde"] }
ipnet = "2"
socket2 = "0.6"
webauthn-rs-core = "=0.6.2"
serde_cbor_2 = "0.13"
x509-parser = "0.18.1"
der-parser = "10.0.0"
pem = "3.0.6"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "form"] }
multer = "3"
futures-util = "0.3"
csv = "1"
tempfile = "3"
unicode_names2 = "3"
bip39 = { version = "2.2", features = ["chinese-simplified", "chinese-traditional", "czech", "french", "italian", "japanese", "korean", "spanish", "zeroize"] }
bip32 = { version = "0.5", default-features = false, features = ["secp256k1", "alloc"] }
alloy-primitives = { version = "1", default-features = false, features = ["serde"] }
alloy-sol-types = { version = "1", default-features = false }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
