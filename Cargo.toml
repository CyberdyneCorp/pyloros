[package]
name = "pyloros"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
jsonwebtoken = "9"
argon2 = "0.5"
chrono = "0.4"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
rsa = "0.9"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
serde_json = "1"
url = "2"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "chrono", "uuid"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
