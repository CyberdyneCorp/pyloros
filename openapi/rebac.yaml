openapi: 3.1.0
info:
  title: Pyloros relationship authorization
  version: '1'
  description: |
    Each graph belongs to one active, administrator-registered confidential client.
    Obtain a service access token with the indicated scope. Use an existing account
    UUID in place of the example UUID. Install the model, grant both example
    assignments, check the child, then revoke the membership and repeat the check.
paths:
  /api/v1/clients/me/rebac/model:
    put:
      operationId: replaceRelationshipModel
      summary: Install or replace the calling client's model
      security: [{service: ['rebac:manage']}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Model'}
            example:
              types:
                collection:
                  relations: {member: [user], parent: [collection]}
                  permissions:
                    read: [{relation: member}, {via: parent, permission: read}]
      responses:
        '204': {description: Model committed or already current. Subsequent permission checks on all API replicas sharing the primary use this model.}
        '409': {description: Existing assignments would become invalid., content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '400': {$ref: '#/components/responses/Malformed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {description: Request exceeds the body size limit.}
        '415': {description: The request requires a JSON media type.}
        '422': {$ref: '#/components/responses/Invalid'}
        '500': {description: Internal server error.}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/clients/me/rebac/relationships:
    put:
      operationId: grantRelationship
      summary: Assign a typed subject to an object
      security: [{service: ['rebac:manage']}]
      requestBody: {$ref: '#/components/requestBodies/Assignment'}
      responses:
        '204': {description: Assignment exists.}
        '409': {$ref: '#/components/responses/MissingModel'}
        '400': {$ref: '#/components/responses/Malformed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {description: Request exceeds the body size limit.}
        '415': {description: The request requires a JSON media type.}
        '422': {$ref: '#/components/responses/Invalid'}
        '500': {description: Internal server error.}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      operationId: revokeRelationship
      summary: Remove the exact assignment in the JSON body
      security: [{service: ['rebac:manage']}]
      requestBody: {$ref: '#/components/requestBodies/Assignment'}
      responses:
        '204': {description: Assignment is absent.}
        '400': {$ref: '#/components/responses/Malformed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {description: Request exceeds the body size limit.}
        '415': {description: The request requires a JSON media type.}
        '422': {$ref: '#/components/responses/Invalid'}
        '500': {description: Internal server error.}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/clients/me/rebac/check:
    post:
      operationId: checkRelationshipPermission
      summary: Evaluate one user permission on one object
      security: [{service: ['rebac:check']}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Check'}
            example:
              user_id: '00000000-0000-0000-0000-000000000001'
              object: {type: collection, id: drafts}
              permission: read
      responses:
        '200':
          description: Evaluation completed. Only an explicit allow grants access.
          headers:
            Cache-Control: {schema: {const: no-store}}
          content:
            application/json:
              schema:
                type: object
                required: [allowed]
                properties: {allowed: {type: boolean}}
              examples:
                inherited: {value: {allowed: true}}
                afterRevocation: {value: {allowed: false}}
        '409': {$ref: '#/components/responses/MissingModel'}
        '400': {$ref: '#/components/responses/Malformed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {description: Request exceeds the body size limit.}
        '415': {description: The request requires a JSON media type.}
        '422': {$ref: '#/components/responses/Invalid'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    service:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /api/v1/auth/oauth2/token
          scopes:
            'rebac:manage': Install models and change assignments.
            'rebac:check': Evaluate object permissions.
  requestBodies:
    Assignment:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Assignment'}
          examples:
            membership:
              value:
                object: {type: collection, id: library}
                relation: member
                subject: {type: user, id: '00000000-0000-0000-0000-000000000001'}
            child:
              value:
                object: {type: collection, id: drafts}
                relation: parent
                subject: {type: collection, id: library}
  schemas:
    Name:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[^\u0000-\u001f\u007f-\u009f]*$'
      description: Up to 128 UTF-8 bytes, excluding control characters.
    ObjectRef:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type: {$ref: '#/components/schemas/Name'}
        id:
          type: string
          minLength: 1
          maxLength: 512
          pattern: '^[^\u0000]*$'
          description: Up to 512 UTF-8 bytes. A user subject identifies an account by UUID.
    Model:
      type: object
      additionalProperties: false
      required: [types]
      properties:
        types:
          type: object
          propertyNames:
            allOf: [{$ref: '#/components/schemas/Name'}, {not: {const: user}}]
          additionalProperties: {$ref: '#/components/schemas/Definition'}
    Definition:
      type: object
      additionalProperties: false
      required: [relations, permissions]
      properties:
        relations:
          type: object
          propertyNames: {$ref: '#/components/schemas/Name'}
          additionalProperties:
            type: array
            minItems: 1
            items: {$ref: '#/components/schemas/Name'}
            description: Each destination must be user or a declared object type.
        permissions:
          type: object
          propertyNames: {$ref: '#/components/schemas/Name'}
          additionalProperties:
            type: array
            minItems: 1
            items:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [relation]
                  properties: {relation: {$ref: '#/components/schemas/Name'}}
                - type: object
                  additionalProperties: false
                  required: [via, permission]
                  properties:
                    via: {$ref: '#/components/schemas/Name'}
                    permission: {$ref: '#/components/schemas/Name'}
    Assignment:
      type: object
      required: [object, relation, subject]
      additionalProperties: false
      properties:
        object:
          allOf:
            - {$ref: '#/components/schemas/ObjectRef'}
            - properties: {type: {not: {const: user}}}
        relation: {$ref: '#/components/schemas/Name'}
        subject:
          allOf:
            - {$ref: '#/components/schemas/ObjectRef'}
            - if: {properties: {type: {const: user}}}
              then: {properties: {id: {type: string, format: uuid}}}
    Check:
      type: object
      required: [user_id, object, permission]
      additionalProperties: false
      properties:
        user_id: {type: string, format: uuid}
        object: {$ref: '#/components/schemas/ObjectRef'}
        permission: {$ref: '#/components/schemas/Name'}
    Problem:
      type: object
      required: [type, title, detail, status]
      properties:
        type: {type: string}
        title: {type: string}
        detail: {type: string}
        status: {type: integer}
  responses:
    Malformed:
      description: Malformed JSON.
      content: {text/plain: {schema: {type: string}}}
    Unauthorized:
      description: Missing or invalid service credentials.
      headers: {WWW-Authenticate: {schema: {const: Bearer}}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Forbidden:
      description: Required token scope or current registration grant is missing.
      content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
    MissingModel:
      content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
      description: Install a model for this client first.
    Invalid:
      description: Invalid JSON shape, identifier, model definition, assignment or check.
      content:
        application/json: {schema: {$ref: '#/components/schemas/Problem'}}
        text/plain: {schema: {type: string}}
    Unavailable:
      description: Relationship storage is unavailable or a decision could not be established within evaluation limits.
      content:
        application/json: {schema: {$ref: '#/components/schemas/Problem'}}
