services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pyloros
      POSTGRES_PASSWORD: local-development
      POSTGRES_DB: pyloros
    ports:
      - "127.0.0.1:${PYLOROS_PG_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyloros -d pyloros"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  pgdata:
